name: Verify TrustBoundary v1.4 reproducibility
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install runtime and test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run complete automated test suite
        run: python -m pytest -q
      - name: Reproduce original 42-case historical baseline
        run: bash scripts/reproduce_baseline_v121.sh
      - name: Reproduce v1.4 evaluation on 60 known cases
        run: python scripts/evaluate_adversarial.py --corpus tests/unseen_20261010.json --name ci_known_60
      - name: Reproduce v1.4 evaluation on 40 newly authored cases
        run: python scripts/evaluate_adversarial.py --corpus tests/new_challenge_v14_frozen.json --name ci_new_40
      - name: Check honest new-set metrics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('reports/ci_new_40_metrics.json').read_text())
          assert x['counts']=={'TP':7,'FP':1,'TN':19,'FN':13}, x['counts']
          print('Verified: 7/20 attacks detected, 13 misses and one benign false positive.')
          PY
