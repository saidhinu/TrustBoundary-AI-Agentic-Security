name: Verify TrustBoundary v1.6 source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Scan Git history for high-confidence secrets
        run: python scripts/scan_git_secrets.py
      - name: Run automated tests
        run: python -m pytest -q
      - name: Historical 42-case evidence
        run: bash scripts/reproduce_baseline_v121.sh
      - name: Re-evaluate known 40-case challenge
        run: python scripts/evaluate_adversarial.py --corpus tests/new_challenge_v14_frozen.json --name ci_known_40
      - name: Re-evaluate 50 benign business examples
        run: python scripts/evaluate_adversarial.py --corpus tests/benign_50_business.json --name ci_benign_50
      - name: Grouped synthetic-family ML validation
        run: python scripts/evaluate_groupcv.py
